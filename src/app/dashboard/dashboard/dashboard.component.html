<div class="for-margin">
  <div class="d-flex">
    <!-- <app-sidebar [isOpen]="isSidebarOpen"> -->
    <!-- </app-sidebar> -->

    <div class="flex-grow-1">
      <!-- <app-topbar (toggleSidebar)="onToggleSidebar()"></app-topbar> -->

      <div class="p-4">
        <ng-container [ngSwitch]="selectedSection">
          <app-recipy *ngSwitchCase="'recipy'"></app-recipy>

          <div *ngSwitchCase="'dashboard'">
            <h4 mat-dialog-title class="mb-4 mr-2">Recipe Dashboard</h4>

            <div class="container-fluid">
              <div class="d-flex align-items-center" style="justify-content: space-between;">
                <div>
                  <div class="d-flex justify-content-start align-items-center">
                    <mat-form-field appearance="outline" class="search-field w-100">
                      <mat-label>Search</mat-label>
                      <input matInput [(ngModel)]="projectFilter" />
                    </mat-form-field>
                    <button class="mr-3 filter-recipe me-3" (click)="applyCustomFilter()">
                      <i class="me-2"></i> Filter
                    </button>
                    <button class="mr-3 reset-contact-btn btn btn " (click)="resetFilter()">
                      Reset
                    </button>
                  </div>
                </div>


                <div class="mr-3 me-4 count-box">Total Recipes {{ count }}</div>
              </div>




              <div class="d-flex gap-5 mb-3 p-2">
                <div class="slider-container">
                  <label class="slider-label">Tensile Modules in MPa</label>
                  <div class="slider-wrapper">
                    <input type="range" min="0" max="1000" step="1" [(ngModel)]="tensileMin" (change)="onTensileChange()" (input)="updateTrack()"
                      class="thumb thumb-min" />
                    <input type="range" min="0" max="1000" step="1" [(ngModel)]="tensileMax" (change)="onTensileChange()" (input)="updateTrack()"
                      class="thumb thumb-max" />
                    <div class="slider-base-track"></div>
                    <div class="slider-track" [ngStyle]="trackStyle"></div>
                  </div>
                  <div class="range-values">
                    {{ tensileMin }} - {{ tensileMax }}
                  </div>
                </div>

                <div class="slider-container">
                  <label class="slider-label">Charpy impact strength in kJ/m²</label>
                  <div class="slider-wrapper">
                    <input type="range" min="0" max="1000" step="1" [(ngModel)]="charpyMin" (change)="onCharpyChange()" (input)="updateCharpyTrack()"
                      class="thumb thumb-min" />
                    <input type="range" min="0" max="1000" step="1" [(ngModel)]="charpyMax" (change)="onCharpyChange()" (input)="updateCharpyTrack()"
                      class="thumb thumb-max" />
                    <div class="slider-base-track"></div>
                    <div class="slider-track" [ngStyle]="charpyTrackStyle"></div>
                  </div>
                  <div class="range-values">
                    {{ charpyMin }} - {{ charpyMax }}
                  </div>
                </div>
                <div class="slider-container">
                  <label class="slider-label">StressAtYield in MPa</label>
                  <div class="slider-wrapper">
                    <input type="range" min="0" max="1000" step="1" [(ngModel)]="stressMin" (change)="onStressChange()" (input)="updateStressTrack()"
                      class="thumb thumb-min" />
                    <input type="range" min="0" max="1000" step="1" [(ngModel)]="stressMax" (change)="onStressChange()" (input)="updateStressTrack()"
                      class="thumb thumb-max" />
                    <div class="slider-base-track"></div>
                    <div class="slider-track" [ngStyle]="stressTrackStyle"></div>
                  </div>
                  <div class="range-values">
                    {{ stressMin }} - {{ stressMax }}
                  </div>
                </div>

                
              </div>






              <div class="">
                <div class="row">
                  <div class="col-lg-4 col-md-6 col-sm-12 mb-4" *ngFor="let recipe of paginatedRecipes">
                    <div class="card h-100 shadow-sm" style="height: 300px">
                      <div class="card-header fw-bold">
                        {{ recipe.projectNumber }}
                      </div>

                      <div class="card-body"
                        style="max-height: 150px; overflow-y: scroll; scrollbar-width: none; -ms-overflow-style: none;">
                        <div class="card-text text-muted small mb-2">
                          {{ recipe.productName}}
                        </div>
                        <div class="card-text text-muted small mb-2">
                          <!-- ID: {{ recipe.recipeId }} -->
                        </div>
                        <hr>


                        <div class="descriptions">
                          {{ recipe.description }}
                        </div>


                      </div>

                      <!-- <div style="background-color: rgb(168, 165, 165); min-height: 117px;">                   -->
                      <hr>

                      <div class="progress-info-box">
                        <div class="progress-item">
                          <label class="progress-label"><b>Tensile Modulus : </b>{{recipe.tensileModulus_DAM}} MPa</label>
                          <div class="progress">
                            <div class="progress-bar" role="progressbar"
                              [attr.aria-valuenow]="recipe.tensileModulus_DAM" aria-valuemin="0" aria-valuemax="1000"
                              [style.width.%]="(recipe.tensileModulus_DAM ?? 0) / 1000 * 100">
                            </div>
                          </div>
                        </div>

                        <div class="progress-item">
                          <label class="progress-label"><b>Charpy Impact : </b>{{recipe.charpyImpact_DAM}} KJ/m3</label>
                          <div class="progress">
                            <div class="progress-bar" role="progressbar" [attr.aria-valuenow]="recipe.charpyImpact_DAM"
                              aria-valuemin="0" aria-valuemax="1000"
                              [style.width.%]="(recipe.charpyImpact_DAM ?? 0) / 1000 * 100 ">
                            </div>
                          </div>
                        </div>
                        <div class="progress-item">
                          <label class="progress-label"><b>StressAtYield  : </b><br>{{recipe.stressAtYield_DAM}} MPa</label>
                          <div class="progress">
                            <div class="progress-bar" role="progressbar" [attr.aria-valuenow]="recipe.stressAtYield_DAM"
                              aria-valuemin="0" aria-valuemax="100"
                              [style.width.%]="(recipe.stressAtYield_DAM ?? 0) / 1000 * 100">
                            </div>
                          </div>
                        </div>
                      </div>






                      <div class="d-flex justify-content-end mt-auto" *ngIf="recipe.recipeId !== undefined"
                        (click)="gotoDetailsPage(recipe.recipeId)">
                        <button class="btn btn-light details">View</button>
                      </div>
                      <!-- </div> -->
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <nav aria-label="Page navigation example " style="margin-bottom: 50px">
              <ul class="pagination justify-content-center">
                <li class="page-item disabled" [class.disabled]="currentPage === 1">
                  <a class="page-link rounded-0" (click)="goToPage(currentPage - 1)" aria-label="Previous"
                    matTooltip="Previous page">
                    << </a>
                </li>
                <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index"
                  [class.active]="currentPage === i + 1">
                  <a class="page-link rounded-0" aria-current="page" (click)="goToPage(i + 1)">{{ i + 1 }}</a>
                </li>

                <li class="page-item" [class.disabled]="currentPage === totalPages">
                  <a class="page-link rounded-0" (click)="goToPage(currentPage + 1)" matTooltip="Next page">
                    >>
                  </a>
                </li>
              </ul>
            </nav>
          </div>

      </div>
    </div>
  </div>
</div>
