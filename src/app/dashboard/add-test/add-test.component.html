<div class="for-margin">
  <mat-horizontal-stepper linear>
    <!-- Step 1: Mechanical Properties -->
    <mat-step [stepControl]="mechanicalForm">
      <form [formGroup]="mechanicalForm">
        <ng-template matStepLabel>Mechanical Properties</ng-template>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Product Name</mat-label>
          <input matInput formControlName="productName" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Recipe Number</mat-label>
          <input matInput formControlName="recipeNumber" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Comment</mat-label>
          <input matInput formControlName="comment" />
        </mat-form-field>

        <!-- Add other mechanical fields similarly -->
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Tensile Modulus</mat-label>
          <input matInput formControlName="tensileModulus" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Stress at Yield</mat-label>
          <input matInput formControlName="stressAtYield" />
        </mat-form-field>

        <!-- Add the rest of the Mechanical fields as needed -->

        <div class="button-group">
          <button mat-button color="warn" (click)="onCancel()">Cancel</button>
          <button mat-button matStepperNext>Next</button>
        </div>
      </form>
    </mat-step>

    <!-- Step 2: Temperature Properties -->
    <mat-step [stepControl]="temperatureForm">
      <form [formGroup]="temperatureForm">
        <ng-template matStepLabel>Temperature Properties</ng-template>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Heat Deflection Temperature</mat-label>
          <input matInput formControlName="heatDeflectionTemp" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Temperature of Deflection Under Load</mat-label>
          <input matInput formControlName="deflectionTempUnderLoad" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Melting Temperature</mat-label>
          <input matInput formControlName="meltingTemp" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Thermal Expansion (Parallel)</mat-label>
          <input matInput formControlName="linearExpansionParallel" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Thermal Expansion (Transverse)</mat-label>
          <input matInput formControlName="linearExpansionTransverse" />
        </mat-form-field>

        <div class="button-group">
          <button mat-button matStepperPrevious>Back</button>
          <button mat-button color="primary" (click)="onSubmit()">Save & Next</button>
        </div>
      </form>
    </mat-step>
  </mat-horizontal-stepper>
</div>
