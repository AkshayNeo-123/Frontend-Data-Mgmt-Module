<div class="container p-4">
  <h3 class="text-center">Forgot Password</h3>

  <form [formGroup]="forgotForm">
    <div class="mb-3">
      <label>Email</label>
      <input type="email" class="form-control" formControlName="email" />
    </div>

    <div *ngIf="!otpSent" class="mb-3">
      <button class="btn btn-warning w-100" (click)="sendOtp()">Send OTP</button>
    </div>

    <div *ngIf="otpSent && !otpVerified">
      <div class="mb-3">
        <label>Enter OTP</label>
        <input type="text" class="form-control" formControlName="otp" maxlength="6" />
      </div>
      <button class="btn btn-info w-100" (click)="verifyOtp()">Verify OTP</button>
    </div>

    <div *ngIf="otpVerified">
      <div class="mb-3">
        <label>New Password</label>
        <input type="password" class="form-control" formControlName="newPassword" />
      </div>
      <div class="mb-3">
        <label>Confirm Password</label>
        <input type="password" class="form-control" formControlName="confirmPassword" />
      </div>
      <button class="btn btn-success w-100" (click)="resetPassword()">Reset Password</button>
    </div>
  </form>
</div>
