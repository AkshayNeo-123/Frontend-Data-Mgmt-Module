<div class="container-fluid forgot-container d-flex justify-content-center align-items-center">
  <div class="col-6"></div>

  <div class="col-md-6 forgot-box p-4 rounded shadow-lg">
    <h2 class="text-center fw-bold mb-4 heading-underline">
      <span>Reset Password</span>
    </h2>

    <form [formGroup]="forgotForm">
      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
        <input type="email" class="form-control" formControlName="email" placeholder="Enter your email" />
      </div>
      <small class="text-danger"
        *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.hasError('required')">
        Email is required.
      </small>
      <small class="text-danger" *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.hasError('email')">
        Please enter a valid email.
      </small>

      <div *ngIf="!otpSent" class="mb-3">
        <button type="button" class="forgot-btn w-100 mt-3" (click)="sendOtp()" [disabled]="isSendingOtp">
          <!-- <i class="fas fa-paper-plane me-2"></i> Send OTP -->
          <span *ngIf="!isSendingOtp">
            <i class="fas fa-paper-plane me-2"></i> Send OTP
          </span>
          <span *ngIf="isSendingOtp">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Sending...
          </span>
        </button>
      </div>

      <div *ngIf="otpSent && !otpVerified" class="mb-3">
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="fas fa-shield-alt"></i></span>
          <input type="password" class="form-control" formControlName="otp" maxlength="6" placeholder="Enter OTP" />
        </div>
        <button type="button" class="verify-btn w-100" (click)="verifyOtp()">
          <i class="fas fa-check-circle me-2"></i> Verify OTP
        </button>
      </div>

      <div *ngIf="otpVerified">
        <div class="mb-3 input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" class="form-control" formControlName="newPassword" placeholder="New password" />
        </div>
        <!-- <div class="mb-3 input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" class="form-control" formControlName="confirmPassword"
            placeholder="Confirm password" />
        </div> -->
        <div class="mb-3 input-group">
  <span class="input-group-text"><i class="fas fa-lock"></i></span>
  
  <input
    [type]="showConfirmPassword ? 'text' : 'password'"
    class="form-control"
    formControlName="confirmPassword"
    placeholder="Confirm password"
  />

  <span class="input-group-text" (click)="toggleConfirmPasswordVisibility()" style="cursor: pointer;">
    <i class="fas" [ngClass]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
  </span>
</div>
        <button type="button" class="reset-btn w-100" (click)="resetPassword()">
          <i class="fas fa-sync-alt me-2"></i> Reset Password
        </button>
      </div>

      <div class="d-flex justify-content-center mt-3">
        <a [routerLink]="['/login']" class="btn btn-link text-decoration-none">
          <i class="fas fa-arrow-left me-2"></i> Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
